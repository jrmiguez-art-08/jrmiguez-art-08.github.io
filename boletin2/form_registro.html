<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Desarrolladores</title>
</head>
<body>

    <h1>Registro de Desarrolladores</h1>

    <form action="https://lm.ciclo.iesnervion.es/registro.php" method="POST">

        <label for="codigo">Código de Alumno:</label>
        <input type="text" id="codigo" name="codigo" pattern="[A-Z]{3}[0-9]{3}" placeholder="Ej: DAM123" title="Debe contener 3 letras mayúsculas seguidas de 3 números" required>
        <br><br>

        <label for="email">Correo corporativo:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="16" max="65">
        <br><br>

        <label for="telefono">Teléfono de contacto:</label>
        <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" title="Introduce exactamente 9 números">
        <br><br>

        <label for="web">Sitio web / Portfolio:</label>
        <input type="url" id="web" name="web" placeholder="https://tusitio.com">
        <br><br>

        <label for="ide">IDE Preferido:</label>
        <input type="text" id="ide" name="ide" list="lista-ides">
        <datalist id="lista-ides">
            <option value="IntelliJ IDEA">
            <option value="Visual Studio Code">
            <option value="Eclipse">
            <option value="Android Studio">
        </datalist>
        <br><br>

        <input type="checkbox" id="politica" name="politica" required>
        <label for="politica">Acepto la Política de Privacidad</label>
        <br><br>

        <button type="submit">Registrar</button>

    </form>

</body>
</html>
